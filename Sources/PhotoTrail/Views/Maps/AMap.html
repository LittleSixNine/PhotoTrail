<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoTrail Map</title>
  <style>
    :root { color-scheme: light dark;
      --map-background: #f0f0ed; --panel: #fff; --text: #222; --secondary: #555;
      --popup: rgba(250,250,250,.92); --button: rgba(255,255,255,.75);
      --border: rgba(90,90,90,.2); --shadow: rgba(0,0,0,.22); }
    @media (prefers-color-scheme: dark) {
      :root { --map-background: #202224; --panel: #2c2e30; --text: #f2f2f3; --secondary: #b8bbc0;
        --popup: rgba(40,42,45,.94); --button: rgba(255,255,255,.08);
        --border: rgba(255,255,255,.18); --shadow: rgba(0,0,0,.4); }
    }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { background: var(--map-background); font-family: -apple-system, sans-serif; }
    #notice { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: var(--panel); color: var(--text); padding: 10px 14px; border-radius: 6px; pointer-events: none; }
    .location-popup { width: max-content; min-width: 200px; max-width: 300px; box-sizing: border-box; padding: 10px; border-radius: 14px;
      background: var(--popup); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 3px 16px var(--shadow); color: var(--text); }
    .location-popup strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; margin-bottom: 5px; }
    .location-popup small { display: block; font: 10px ui-monospace, monospace; color: var(--secondary); margin-bottom: 8px; }
    .location-popup .actions { display: flex; gap: 6px; }
    .location-popup button { min-height: 44px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--button); color: var(--text); cursor: pointer; font: 12px -apple-system, sans-serif; }
    .location-popup button:first-child { flex: 1; }
    .location-popup button:last-child { min-width: 44px; }
    .location-popup button:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
    .location-popup button:disabled { opacity: .42; cursor: default; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="notice"></div>
  <script>
    "use strict";
    window.photoTrail = (() => {
      const locale = window.photoTrailLocalization ?? { language: "en", strings: {} };
      const t = key => locale.strings[key] ?? key;
      const escapeAttribute = value => value.replace(/&/g, "&amp;").replace(/"/g, "&quot;")
        .replace(/</g, "&lt;").replace(/>/g, "&gt;");
      if (document.documentElement) document.documentElement.lang = locale.language;
      if (document.title !== undefined) document.title = t("PhotoTrail 地图");
      let map, geocoder, marker, previewMarker, deviceMarker, locationPopup;
      let searchArea = { mode: "nationwide", bounds: null, notified: "", gesture: false };
      let cityIndex;
      let previewGeneration = 0;
      let deviceGeneration = 0, previewLocation = null, deviceLocation = null;
      let startup = { allowed: true, center: null, zoom: 12 };
      let snapshot = { revision: 0, editable: false, point: null, photos: [], allowDoubleClick: true, allowDragPin: true, selectedPhotoIDs: [] };
      let sequence = 0;
      let displayGeneration = 0;
      let photoGeneration = 0, photoKey = "", photoFrame = null;
      let stablePhotoGroups = [];
      const photoPoints = new Map();
      const photoCoordinateCache = new Map();
      const notice = document.getElementById("notice");
      notice.textContent = t("正在加载高德地图…");
      const post = body => window.webkit.messageHandlers.photoTrail.postMessage(body);
      const status = message => { notice.textContent = message; post({ type: "status", message }); };
      const valid = point => point && Number.isFinite(point.latitude) && Number.isFinite(point.longitude)
        && Math.abs(point.latitude) <= 90 && Math.abs(point.longitude) <= 180;

      function timedCall(register) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("service_timeout")), 15000);
          register((error, value) => {
            clearTimeout(timer);
            if (error) reject(error); else resolve(value);
          });
        });
      }

      async function convertGPS(point) {
        if (!valid(point)) throw new Error("invalid_coordinate");
        return timedCall(done => AMap.convertFrom([point.longitude, point.latitude], "gps", (state, result) => {
          const location = result && result.locations && result.locations[0];
          if (state !== "complete" || !location) return done(new Error("coordinate_conversion_failed"));
          const converted = { latitude: location.getLat(), longitude: location.getLng() };
          done(valid(converted) ? null : new Error("invalid_response_coordinate"), converted);
        }));
      }

      function emitPhotoPositions(regroup = true) {
        if (!map) return;
        const container = document.getElementById("map");
        const width = container?.clientWidth || Number.POSITIVE_INFINITY;
        const height = container?.clientHeight || Number.POSITIVE_INFINITY;
        const padding = 28;
        const area = width * height;
        const cellSize = Math.max(52, Number.isFinite(area) ? Math.sqrt(area / 1600) : 52);
        if (regroup || stablePhotoGroups.length === 0) {
          const groups = new Map();
          for (const [id, point] of photoPoints) {
            const pixel = map.lngLatToContainer([point.longitude, point.latitude]);
            if (!pixel || !Number.isFinite(pixel.x) || !Number.isFinite(pixel.y)
              || pixel.x < -padding || pixel.y < -padding
              || pixel.x > width + padding || pixel.y > height + padding) continue;
            const key = `${Math.round(pixel.x / cellSize)}:${Math.round(pixel.y / cellSize)}`;
            const ids = groups.get(key);
            if (ids) ids.push(id); else groups.set(key, [id]);
          }
          stablePhotoGroups.splice(0, stablePhotoGroups.length, ...groups.values());
        }
        const positions = stablePhotoGroups.map(ids => {
          const pixels = ids.map(id => photoPoints.get(id)).filter(Boolean).map(point =>
            map.lngLatToContainer([point.longitude, point.latitude])).filter(pixel => pixel
              && Number.isFinite(pixel.x) && Number.isFinite(pixel.y));
          if (!pixels.length) return null;
          const x = pixels.reduce((sum, pixel) => sum + pixel.x, 0) / pixels.length;
          const y = pixels.reduce((sum, pixel) => sum + pixel.y, 0) / pixels.length;
          return x < -padding || y < -padding || x > width + padding || y > height + padding
            ? null : { ids, x, y };
        }).filter(Boolean);
        const edgeInset = 36, center = { x: width / 2, y: height / 2 };
        const edges = Number.isFinite(width) && Number.isFinite(height)
          ? (snapshot.selectedPhotoIDs || []).map(id => {
              const point = photoPoints.get(id);
              if (!point) return null;
              const pixel = map.lngLatToContainer([point.longitude, point.latitude]);
              if (!pixel || !Number.isFinite(pixel.x) || !Number.isFinite(pixel.y)
                || (pixel.x >= edgeInset && pixel.x <= width - edgeInset
                  && pixel.y >= edgeInset && pixel.y <= height - edgeInset)) return null;
              const dx = pixel.x - center.x, dy = pixel.y - center.y;
              const horizontal = dx ? (width / 2 - edgeInset) / Math.abs(dx) : Infinity;
              const vertical = dy ? (height / 2 - edgeInset) / Math.abs(dy) : Infinity;
              const scale = Math.min(horizontal, vertical);
              return { id, x: center.x + dx * scale, y: center.y + dy * scale,
                angle: Math.atan2(dy, dx) };
            }).filter(Boolean) : [];
        post({ type: "photoPositions", positions, edges });
      }

      function schedulePhotoPositions() {
        if (photoFrame !== null) return;
        const nextFrame = window.requestAnimationFrame || (callback => setTimeout(callback, 16));
        photoFrame = nextFrame(() => { photoFrame = null; emitPhotoPositions(false); });
      }

      const photoCoordinateKey = point => `${point.latitude.toFixed(8)}:${point.longitude.toFixed(8)}`;
      function cachePhotoPoint(key, point) {
        if (photoCoordinateCache.has(key)) photoCoordinateCache.delete(key);
        photoCoordinateCache.set(key, point);
        if (photoCoordinateCache.size > 10000)
          photoCoordinateCache.delete(photoCoordinateCache.keys().next().value);
      }

      async function renderPhotos(photos) {
        if (!Array.isArray(photos) || !photos.every(photo => Number.isInteger(photo.id)
          && valid(photo.point))) return;
        const key = photos.map(photo => `${photo.id}:${photo.point.latitude}:${photo.point.longitude}`).join("|");
        if (key === photoKey) { emitPhotoPositions(true); return; }
        photoKey = key;
        const generation = ++photoGeneration;
        photoPoints.clear();
        try {
          const missing = new Map();
          for (const photo of photos) {
            const coordinateKey = photoCoordinateKey(photo.point);
            const cached = photoCoordinateCache.get(coordinateKey);
            if (cached) photoPoints.set(photo.id, cached);
            else {
              const entry = missing.get(coordinateKey);
              if (entry) entry.ids.push(photo.id);
              else missing.set(coordinateKey, { point: photo.point, ids: [photo.id] });
            }
          }
          const entries = [...missing.entries()];
          for (let offset = 0; offset < entries.length; offset += 40) {
            const batch = entries.slice(offset, offset + 40);
            const converted = await timedCall(done => AMap.convertFrom(
              batch.map(([, entry]) => [entry.point.longitude, entry.point.latitude]), "gps", (state, result) => {
                if (state !== "complete" || result?.locations?.length !== batch.length)
                  return done(new Error("photo_conversion_failed"));
                const points = result.locations.map(point => ({
                  latitude: point.getLat(), longitude: point.getLng() }));
                done(points.every(valid) ? null : new Error("invalid_response_coordinate"), points);
              }));
            if (generation !== photoGeneration) return;
            batch.forEach(([coordinateKey, entry], index) => {
              cachePhotoPoint(coordinateKey, converted[index]);
              entry.ids.forEach(id => photoPoints.set(id, converted[index]));
            });
            emitPhotoPositions(true);
            if (offset + 40 < entries.length) await new Promise(resolve => setTimeout(resolve, 1100));
          }
          if (generation === photoGeneration) emitPhotoPositions(true);
        } catch (_) {
          if (generation === photoGeneration) {
            photoPoints.clear(); emitPhotoPositions(true);
            status(t("部分照片位置显示失败；原照片数据未改变。请检查网络或服务配额。"));
          }
        }
      }

      let trackRequest = Promise.resolve(), nextTrackConversion = 0;
      const trackJobs = new Map(), trackLines = new Map();
      let trackStyle = { strokeColor: "#FF3B30", strokeWeight: 3 }, selectedTrack = null;

      function setTrackStyle(color, width) {
        trackStyle = { strokeColor: /^#[0-9a-f]{6}$/i.test(color) ? color : "#FF3B30",
          strokeWeight: Number.isFinite(width) && width > 0 ? width : 3 };
        for (const [id, entry] of trackLines) for (const line of entry.lines)
          line.setOptions({ ...trackStyle, strokeOpacity: !selectedTrack || selectedTrack === id ? 0.85 : 0.35 });
      }

      function renderTracks(records, selected) {
        selectedTrack = selected;
        const ids = new Set(records.map(record => record.id));
        for (const [id, entry] of trackLines) if (!ids.has(id)) {
          map.remove(entry.lines); trackLines.delete(id);
        }
        for (const record of records) {
          if (trackLines.get(record.id)?.version === record.version) continue;
          if (!record.segments.every(segment => segment.length >= 2 && segment.every(valid))) continue;
          if (trackLines.has(record.id)) map.remove(trackLines.get(record.id).lines);
          const lines = record.segments.map(segment => new AMap.Polyline({
            path: segment.map(point => [point.longitude, point.latitude]), ...trackStyle,
            strokeStyle: "dashed", strokeDasharray: [10, 5], lineJoin: "round", lineCap: "round", bubble: true, zIndex: 40
          }));
          map.add(lines);
          trackLines.set(record.id, { version: record.version, lines });
        }
        setTrackStyle(trackStyle.strokeColor, trackStyle.strokeWeight);
      }

      function fitTracks(id) {
        const lines = id ? trackLines.get(id)?.lines : [...trackLines.values()].flatMap(entry => entry.lines);
        if (map && lines?.length) { startup.allowed = false; map.setFitView(lines, false, [80, 60, 120, 60], 17); }
      }

      function cancelTrack(request) {
        const job = trackJobs.get(request);
        if (job) job.cancelled = true;
      }

      // All files share this queue and QPS budget. Rendering/cached tracks never enter the queue.
      function convertTracks(segments, request) {
        const job = { cancelled: false };
        trackJobs.set(request, job);
        const result = trackRequest.then(async () => {
          if (job.cancelled) { trackJobs.delete(request); return { cancelled: true }; }
          let completed = 0, total = 0;
          const report = () => post({ type: "tracks", request, completed, total });
          try {
            if (!Array.isArray(segments) || !segments.every(segment => Array.isArray(segment)
              && segment.length >= 2 && segment.every(valid))) throw new Error("invalid_track_coordinate");
            total = segments.reduce((count, segment) => count + segment.length, 0);
            report();
            const paths = [];
            for (const segment of segments) {
              const path = [];
              for (let offset = 0; offset < segment.length; offset += 40) {
                if (job.cancelled) return { cancelled: true };
                const batch = segment.slice(offset, offset + 40);
                let points;
                for (let attempt = 0; ; attempt++) {
                  const delay = nextTrackConversion - Date.now();
                  if (delay > 0) await new Promise(resolve => setTimeout(resolve, delay));
                  if (job.cancelled) return { cancelled: true };
                  nextTrackConversion = Date.now() + 1100;
                  try {
                    points = await timedCall(done => AMap.convertFrom(
                      batch.map(point => [point.longitude, point.latitude]), "gps", (state, result) => {
                        if (state !== "complete") {
                          const code = typeof result === "string" ? result : result?.info;
                          return done(new Error(/^[A-Z][A-Z0-9_]{0,79}$/.test(code ?? "")
                            ? `amap_service:${code}` : "amap_conversion_failed"));
                        }
                        if (result?.locations?.length !== batch.length)
                          return done(new Error("incomplete_coordinates"));
                        try {
                          const converted = result.locations.map(point => ({
                            latitude: point.getLat(), longitude: point.getLng() }));
                          done(converted.every(valid) ? null : new Error("invalid_response_coordinate"), converted);
                        } catch (_) { done(new Error("invalid_response_coordinate")); }
                      }));
                    break;
                  } catch (error) {
                    if (job.cancelled) return { cancelled: true };
                    if (attempt >= 2 || !/QPS.*(?:LIMIT|EXCEEDED)/.test(error.message)) throw error;
                    nextTrackConversion = Date.now() + 1100 * (attempt + 1);
                  }
                }
                if (job.cancelled) return { cancelled: true };
                path.push(...points);
                completed += batch.length;
                report();
              }
              paths.push(path);
            }
            return { segments: paths };
          } catch (error) {
            if (job.cancelled) return { cancelled: true };
            return { error: /^(service_timeout|invalid_track_coordinate|invalid_response_coordinate|amap_conversion_failed|incomplete_coordinates|amap_service:[A-Z][A-Z0-9_]{0,79})$/.test(error?.message ?? "")
              ? error.message : "track_conversion_failed" };
          } finally { trackJobs.delete(request); }
        });
        trackRequest = result.catch(() => {});
        return result;
      }

      async function selectPoint(event, purpose = "apply", name = "", photoID = null,
                                 originalPhotoPoint = null) {
        startup.allowed = false;
        const photoEditable = purpose === "photo"
          && snapshot.photos?.some(photo => photo.id === photoID && photo.editable);
        if (((purpose === "apply" || purpose === "map") && !snapshot.editable)
          || (purpose === "map" && snapshot.allowDoubleClick === false)
          || (purpose === "photo" && (snapshot.allowDragPin === false || !photoEditable))) {
          status(t("请先选择可编辑的照片。")); return;
        }
        const revision = snapshot.revision;
        const currentSequence = ++sequence;
        post({ type: "pickStarted", revision, sequence: currentSequence, purpose,
          photoID, originalPhotoPoint });
        status(t("正在校验所选位置…"));
        try {
          const point = { latitude: event.lnglat.getLat(), longitude: event.lnglat.getLng() };
          if (!valid(point)) throw new Error("invalid_coordinate");
          const address = await timedCall(done => geocoder.getAddress([point.longitude, point.latitude],
            (state, result) => {
              const component = result && result.regeocode && result.regeocode.addressComponent;
              done(state === "complete" && component ? null : new Error("unknown_region"), component);
            }));
          if (currentSequence !== sequence) return;
          if (purpose === "photo") {
            const current = snapshot.photos?.find(photo => photo.id === photoID);
            if (!current?.editable || !originalPhotoPoint
              || current.point.latitude !== originalPhotoPoint.latitude
              || current.point.longitude !== originalPhotoPoint.longitude
              || !snapshot.selectedPhotoIDs?.includes(photoID)) {
              status(t("照片状态已变化，请重新拖动。")); return;
            }
          } else if (revision !== snapshot.revision) return;
          post({ type: "pick", revision, sequence: currentSequence,
            latitude: point.latitude, longitude: point.longitude, purpose, name, photoID,
            originalPhotoPoint,
            adcode: String(address.adcode || "") });
        } catch (_) {
          if ((purpose === "photo" || revision === snapshot.revision) && currentSequence === sequence)
            status(t("所选位置校验失败，未修改照片。请检查网络、凭据或服务配额。"));
        }
      }

      async function updateSnapshot(next, changedPhotos = next.photos) {
        if (Array.isArray(changedPhotos)) {
          next.photos = changedPhotos;
          renderPhotos(changedPhotos);
        } else next.photos = snapshot.photos || [];
        snapshot = next;
        if (locationPopup) locationPopup.close();
        emitPhotoPositions(false);
        notice.hidden = true;
      }

      function pickPhotoAt(id, point) {
        if (!photoPoints.has(id) || !point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
        const location = map.containerToLngLat(new AMap.Pixel(point.x, point.y));
        const original = snapshot.photos?.find(photo => photo.id === id)?.point;
        selectPoint({ lnglat: location }, "photo", "", id, original);
      }

      function focusPhoto(id) {
        const point = photoPoints.get(id);
        if (map && point) { startup.allowed = false; map.setCenter([point.longitude, point.latitude]); }
      }

      async function focusWGS84(point) {
        if (!map || !valid(point) || !startup.allowed) return false;
        const before = map.getCenter(), zoom = map.getZoom();
        if (before.getLat() !== startup.center[1] || before.getLng() !== startup.center[0]
          || zoom !== startup.zoom) return false;
        try {
          const displayed = await convertGPS(point);
          const current = map.getCenter();
          if (!startup.allowed || current.getLat() !== before.getLat() || current.getLng() !== before.getLng()
            || map.getZoom() !== zoom) return false;
          startup.allowed = false;
          map.setZoomAndCenter(12, [displayed.longitude, displayed.latitude]);
          return true;
        } catch (_) { return false; }
      }

      function cancelStartup() { startup.allowed = false; }

      function markerContent(kind, compact = false) {
        const device = kind === "device", scale = compact ? .5 : 1;
        const red = device ? "#c93e37" : "#df4840";
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${34 * scale}" height="${45 * scale}"
          viewBox="0 0 34 45" style="display:block;filter:drop-shadow(0 2px 3px #243c494d)" role="img"
          aria-label="${escapeAttribute(device ? t("设备位置") : t("搜索地点"))}">
          <path d="M9 27H25L17 45Z" fill="${red}"/>
          <circle cx="17" cy="17" r="16" fill="${device ? "white" : red}"
            stroke="${device ? red : "white"}" stroke-width="2.5"/>
          <circle cx="17" cy="17" r="5" fill="${device ? red : "white"}"/></svg>`;
      }

      function deviceCompact() {
        const bounds = map.getBounds();
        if (!bounds) return false;
        const west = bounds.getSouthWest(), east = bounds.getNorthEast();
        const difference = east.getLng() - west.getLng();
        const span = difference >= 360 ? 360 : (difference + 360) % 360;
        const latitude = (west.getLat() + east.getLat()) / 2;
        return span * 111320 * Math.cos(latitude * Math.PI / 180) > 5000;
      }

      function refreshDeviceSize() {
        if (deviceMarker) {
          deviceMarker.setContent(markerContent("device", deviceCompact()));
          if (locationPopup) locationPopup.close();
        }
      }

      function openLocationPopup(kind) {
        const selected = kind === "device" ? deviceLocation : previewLocation;
        if (!selected) return;
        const { displayed, original, name } = selected;
        const container = document.createElement("div");
        container.className = "location-popup";
        container.addEventListener("click", event => event.stopPropagation());
        const title = document.createElement("strong");
        title.textContent = name;
        const subtitle = document.createElement("small");
        subtitle.textContent = `${original.latitude.toFixed(6)}, ${original.longitude.toFixed(6)}`;
        const actions = document.createElement("div");
        actions.className = "actions";
        for (const [purpose, label] of [["apply", t("写入照片")], ["favorite", t("收藏")]]) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          button.disabled = purpose === "apply" && !snapshot.editable;
          button.addEventListener("click", event => {
            event.stopPropagation();
            selectSearch(displayed, purpose, name);
            locationPopup.close();
          });
          actions.append(button);
        }
        container.append(title, subtitle, actions);
        if (locationPopup) locationPopup.close();
        locationPopup = new AMap.InfoWindow({ isCustom: true, content: container,
          offset: new AMap.Pixel(0, kind === "device" && deviceCompact() ? -27 : -49) });
        locationPopup.open(map, [displayed.longitude, displayed.latitude]);
      }

      function makeMarker(point, kind) {
        const pin = new AMap.Marker({ position: [point.longitude, point.latitude],
          anchor: "bottom-center", content: markerContent(kind, kind === "device" && deviceCompact()),
          title: kind === "device" ? t("设备位置") : t("搜索地点"), bubble: false,
          zIndex: kind === "device" ? 110 : 120 });
        pin.on("click", () => { post({ type: "mapClick" }); openLocationPopup(kind); });
        return pin;
      }

      function clearPreview() {
        ++previewGeneration;
        if (previewMarker && map) map.remove(previewMarker);
        previewMarker = null;
        previewLocation = null;
        if (locationPopup) locationPopup.close();
      }

      async function preview(point, wgs84, name = t("地点预览")) {
        startup.allowed = false;
        const generation = ++previewGeneration;
        try {
          if (!valid(point)) throw new Error("invalid_coordinate");
          const displayed = wgs84 ? await convertGPS(point) : point;
          if (generation !== previewGeneration) return;
          if (previewMarker) map.remove(previewMarker);
          if (locationPopup) locationPopup.close();
          previewLocation = { displayed, original: point, name };
          previewMarker = makeMarker(displayed, "search");
          map.add(previewMarker);
          map.setZoomAndCenter(16, [displayed.longitude, displayed.latitude]);
          status(t("红色标记为搜索地点，尚未修改照片。"));
        } catch (_) { if (generation === previewGeneration) status(t("地点预览失败，请检查网络。")); }
      }

      async function setDeviceLocation(point, focus = false) {
        const generation = ++deviceGeneration;
        if (!valid(point) || !map) return;
        try {
          const displayed = await convertGPS(point);
          if (generation !== deviceGeneration) return;
          deviceLocation = { displayed, original: point, name: t("当前位置") };
          if (deviceMarker) map.remove(deviceMarker);
          deviceMarker = makeMarker(displayed, "device");
          map.add(deviceMarker);
          if (focus) { startup.allowed = false; map.setZoomAndCenter(16, [displayed.longitude, displayed.latitude]); }
        } catch (_) { if (generation === deviceGeneration) status(t("设备位置暂时无法显示，请检查网络。")); }
      }

      function searchService(register, extract) {
        return timedCall(done => register((state, result) => {
          if (state === "no_data") return done(null, []);
          if (state !== "complete") return done(new Error("search_failed"));
          done(null, extract(result) || []);
        }));
      }

      function cityRecord(district) {
        const municipalities = ["110000", "120000", "310000", "500000"];
        const point = district.center;
        if (!(district.level === "city" || municipalities.includes(String(district.adcode)))
          || typeof point?.getLat !== "function" || typeof point?.getLng !== "function") return null;
        const value = { name: String(district.name || ""), adcode: String(district.adcode || ""),
          latitude: point.getLat(), longitude: point.getLng() };
        return value.name && /^\d{6}$/.test(value.adcode) && valid(value) ? value : null;
      }

      async function cities(query, allowFallback = true) {
        const keyword = query.trim().toLocaleLowerCase();
        if (!keyword) return [];
        if (!cityIndex) {
          cityIndex = searchService(done => new AMap.DistrictSearch({ level: "country", subdistrict: 2,
            extensions: "base", showbiz: false }).search("中国", done), result => {
              const found = [];
              function visit(item) {
                const city = cityRecord(item);
                if (city) found.push(city);
                else for (const child of item.districtList || []) visit(child);
              }
              for (const root of result.districtList || []) visit(root);
              return found;
            }).catch(error => { cityIndex = null; throw error; });
        }
        const matches = (await cityIndex).filter(city => city.name.toLocaleLowerCase().includes(keyword)
          || city.adcode.startsWith(keyword));
        if (matches.length) return matches.slice(0, 20);
        if (!allowFallback) return [];
        return searchService(done => new AMap.DistrictSearch({ level: "city", subdistrict: 0,
          extensions: "base", showbiz: false }).search(query, done),
          result => (result.districtList || []).map(cityRecord).filter(Boolean));
      }

      function viewportBounds() {
        const bounds = map.getBounds();
        if (!bounds) throw new Error("invalid_search_bounds");
        const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
        const box = [sw.getLng(), sw.getLat(), ne.getLng(), ne.getLat()];
        if (!box.every(Number.isFinite) || box[0] < -180 || box[2] > 180 || box[0] >= box[2]
          || box[1] < -90 || box[3] > 90 || box[1] >= box[3]) throw new Error("invalid_search_bounds");
        return box;
      }

      function noticeSearchArea() {
        if (!searchArea.gesture || searchArea.mode !== "viewport" || !searchArea.bounds) return;
        try {
          const box = viewportBounds(), key = box.map(value => value.toFixed(6)).join(",");
          if (box.some((value, index) => Math.abs(value - searchArea.bounds[index]) > 0.000001)
            && key !== searchArea.notified) {
            searchArea.notified = key;
            post({ type: "searchAreaChanged" });
          }
        } catch (_) { /* A later valid camera change can offer a refresh. */ }
      }

      async function search(query, scope = { mode: "viewport" }) {
        if (!query.trim()) return [];
        if (!["nationwide", "city", "viewport"].includes(scope.mode)
          || (scope.mode === "city" && !/^\d{6}$/.test(scope.adcode))) throw new Error("invalid_search_scope");
        const box = scope.mode === "viewport" ? viewportBounds() : null;
        Object.assign(searchArea, { mode: scope.mode, bounds: box, notified: "", gesture: false });
        const options = { city: scope.mode === "city" ? scope.adcode : "全国",
          citylimit: scope.mode === "city", pageSize: 10, extensions: "base", autoFitView: false };
        const service = new AMap.PlaceSearch(options);
        let citySuggestions = [];
        const requests = [searchService(done => {
          if (box) service.searchInBounds(query, new AMap.Bounds([box[0], box[1]], [box[2], box[3]]), done);
          else service.search(query, done);
        }, result => {
          if (scope.mode === "nationwide") citySuggestions = result?.cityList || [];
          return result?.poiList?.pois;
        })];
        if (!box) {
          requests.push(searchService(done => new AMap.AutoComplete(options).search(query, done), result => result.tips));
        }
        if (/[街路巷弄号栋]|\d|street|road/i.test(query)) {
          requests.unshift(searchService(done => new AMap.Geocoder({ city: options.city, extensions: "base" })
            .getLocation(query, done), result => (result.geocodes || [])
            .filter(item => !["国家", "省", "城市", "市", "区县"].includes(item.level)).map(item => ({ ...item,
              id: "address:" + item.formattedAddress, name: query, address: item.formattedAddress }))));
        }
        const pendingCities = scope.mode === "nationwide" && query.trim().length <= 12
          ? cities(query, false).catch(() => []) : Promise.resolve([]);
        const settled = await Promise.allSettled(requests);
        if (settled.every(item => item.status === "rejected")) throw new Error("search_failed");
        const candidates = settled.flatMap(item => item.status === "fulfilled" ? item.value : []);
        const results = [], seen = new Set(), seenIDs = new Set();
        const namedCities = await pendingCities;
        if (citySuggestions.length && cityIndex) {
          for (const suggested of citySuggestions.slice(0, 5)) {
            const city = (await cityIndex).find(item => item.adcode === String(suggested.adcode || "")
              || item.name.replace(/市$/, "") === String(suggested.name || "").replace(/市$/, ""));
            if (city && !namedCities.some(item => item.adcode === city.adcode)) namedCities.push(city);
          }
        }
        for (const city of namedCities) {
          // Only city-name matches are navigation entries; addresses remain ordinary location results.
          if (citySuggestions.length || city.name.includes(query.trim()) || city.name.replace(/市$/, "") === query.trim())
            results.push({ ...city, id: "city:" + city.adcode, kind: "city", address: city.name });
        }
        for (const poi of candidates) {
          if (typeof poi.location?.getLat !== "function" || typeof poi.location?.getLng !== "function") continue;
          const point = { latitude: poi.location.getLat(), longitude: poi.location.getLng() };
          if (!valid(point)) continue;
          if (box && (point.longitude < box[0] || point.longitude > box[2]
            || point.latitude < box[1] || point.latitude > box[3])) continue;
          if (scope.mode === "city") {
            const prefix = /^(11|12|31|50)0000$/.test(scope.adcode) ? scope.adcode.slice(0, 2) : scope.adcode.slice(0, 4);
            if (!String(poi.adcode || "").startsWith(prefix)) continue;
          }
          const name = String(poi.name || t("未命名地点"));
          const key = name + ":" + point.latitude.toFixed(6) + ":" + point.longitude.toFixed(6);
          if (seen.has(key) || (poi.id && seenIDs.has(String(poi.id)))) continue;
          seen.add(key);
          if (poi.id) seenIDs.add(String(poi.id));
          results.push({ id: String(poi.id || key), name, ...point,
            address: [...new Set([poi.pname, poi.province, poi.cityname, poi.city, poi.adname, poi.district, poi.address]
              .filter(value => typeof value === "string" && value))].join(" ") });
        }
        return results.slice(0, 12);
      }

      function focusCity(city) {
        if (!valid(city)) return;
        startup.allowed = false;
        clearPreview();
        map.setZoomAndCenter(11, [city.longitude, city.latitude]);
      }

      async function selectSearch(point, purpose, name) {
        if (!valid(point) || !["apply", "favorite"].includes(purpose)) return;
        await selectPoint({ lnglat: { getLat: () => point.latitude, getLng: () => point.longitude } }, purpose, name);
      }

      async function start(config) {
        window.forceWebGL = config.preferWebGL !== false;
        window._AMapSecurityConfig = { securityJsCode: config.securityJsCode };
        await timedCall(done => {
          const script = document.createElement("script");
          script.src = "https://webapi.amap.com/loader.js";
          script.onload = () => done(null);
          script.onerror = () => done(new Error("loader_unavailable"));
          document.head.appendChild(script);
        });
        const api = await timedCall(done => AMapLoader.load({
          key: config.key, version: "2.0", plugins: ["AMap.Geocoder", "AMap.PlaceSearch", "AMap.AutoComplete",
            "AMap.DistrictSearch", "AMap.Scale"]
        }).then(value => done(null, value), () => done(new Error("authentication_failed"))));
        const center = Array.isArray(config.initialCenter) && config.initialCenter.length === 2
          && Number.isFinite(config.initialCenter[0]) && Number.isFinite(config.initialCenter[1])
          && Math.abs(config.initialCenter[0]) <= 180 && Math.abs(config.initialCenter[1]) <= 90
          ? config.initialCenter : [121.48, 31.23];
        const zoom = Number.isFinite(config.initialZoom) && config.initialZoom >= 2
          && config.initialZoom <= 20 ? config.initialZoom : 12;
        map = new api.Map("map", { zoom, center, viewMode: "2D",
          resizeEnable: true, doubleClickZoom: false, mapStyle: mapStyleURL(config.mapStyle) });
        startup.center = center;
        startup.zoom = zoom;
        geocoder = new api.Geocoder({ extensions: "base" });
        map.addControl(new api.Scale());
        map.on("dragstart", () => { searchArea.gesture = true; });
        map.on("dragend", () => { noticeSearchArea(); searchArea.gesture = false; });
        document.getElementById("map").addEventListener?.("wheel", () => { searchArea.gesture = true; }, { passive: true });
        map.on("complete", () => post({ type: "rendering", metrics: renderingInfo() }));
        setTimeout(() => post({ type: "rendering", metrics: renderingInfo() }), 5000);
        map.on("rotatechange", () => post({ type: "heading", value: map.getRotation() }));
        for (const event of ["mapmove", "zoomchange"])
          map.on(event, schedulePhotoPositions);
        for (const event of ["moveend", "zoomend", "resize", "rotatechange"])
          map.on(event, () => {
            emitPhotoPositions(true);
            if (event === "zoomend" || event === "resize") refreshDeviceSize();
            if (event === "zoomend") { noticeSearchArea(); searchArea.gesture = false; }
            if (event === "moveend" || event === "zoomend") {
              const point = map.getCenter();
              if (point.getLat() !== startup.center[1] || point.getLng() !== startup.center[0]
                || map.getZoom() !== startup.zoom) startup.allowed = false;
              post({ type: "camera", latitude: point.getLat(), longitude: point.getLng(), zoom: map.getZoom() });
            }
          });
        map.on("dblclick", event => selectPoint(event, "map"));
        map.on("click", () => { if (locationPopup) locationPopup.close(); post({ type: "mapClick" }); });
        notice.hidden = true;
        status(t("高德地图已就绪。点选地图或搜索地点。"));
        return true;
      }

      function renderingInfo() {
        const frames = [];
        function inspect(doc) {
          const canvases = Array.from(doc.querySelectorAll('canvas')).map(canvas => {
            let gl = null;
            try { gl = canvas.getContext('webgl2') || canvas.getContext('webgl')
              || canvas.getContext('experimental-webgl'); } catch (_) {}
            const rect = canvas.getBoundingClientRect();
            return { webgl: !!gl, lost: gl ? gl.isContextLost() : false,
              width: canvas.width, height: canvas.height, cssWidth: rect.width, cssHeight: rect.height };
          });
          const tiles = Array.from(doc.querySelectorAll('.amap-layer img')).filter(image => image.width > 100);
          frames.push({ canvases, rasterTiles: tiles.length });
          for (const frame of doc.querySelectorAll('iframe')) {
            try { if (frame.contentDocument) inspect(frame.contentDocument); } catch (_) {}
          }
        }
        inspect(document);
        return { preferWebGL: window.forceWebGL, sdkWebGL: !!AMap.Browser?.isWebGL,
          dpr: window.devicePixelRatio, frames };
      }

      function navigate(command) {
        if (!map) return;
        startup.allowed = false;
        searchArea.gesture = command === "zoomIn" || command === "zoomOut";
        if (command === "zoomIn") map.setZoom(Math.min(20, map.getZoom() + 1));
        if (command === "zoomOut") map.setZoom(Math.max(2, map.getZoom() - 1));
        if (command === "north") map.setRotation(0);
      }
      function zoomByWheel(steps, pixel) {
        if (!map || !Number.isFinite(steps) || steps === 0
          || !pixel || !Number.isFinite(pixel.x) || !Number.isFinite(pixel.y)) return;
        startup.allowed = false;
        searchArea.gesture = true;
        const oldZoom = map.getZoom();
        const newZoom = Math.min(20, Math.max(2, oldZoom + steps * 0.22));
        if (newZoom === oldZoom) return;
        const anchor = map.containerToLngLat(new AMap.Pixel(pixel.x, pixel.y));
        const center = map.getCenter();
        const project = point => {
          const longitude = point.getLng(), latitude = Math.max(-85.0511, Math.min(85.0511, point.getLat()));
          const radians = latitude * Math.PI / 180;
          return { x: (longitude + 180) / 360,
            y: (1 - Math.log(Math.tan(radians) + 1 / Math.cos(radians)) / Math.PI) / 2 };
        };
        const unproject = point => ({ longitude: point.x * 360 - 180,
          latitude: Math.atan(Math.sinh(Math.PI * (1 - 2 * point.y))) * 180 / Math.PI });
        const anchorWorld = project(anchor), centerWorld = project(center);
        const scale = 2 ** (newZoom - oldZoom);
        const next = unproject({ x: anchorWorld.x + (centerWorld.x - anchorWorld.x) / scale,
          y: anchorWorld.y + (centerWorld.y - anchorWorld.y) / scale });
        map.setZoomAndCenter(newZoom, [next.longitude, next.latitude]);
      }
      async function region(point) {
        const displayed = await convertGPS(point);
        const result = await timedCall(done => geocoder.getAddress([displayed.longitude, displayed.latitude],
          (state, value) => state === "complete" ? done(null, value) : done(new Error("region_lookup_failed"))));
        const address = result?.regeocode?.addressComponent || {};
        const text = value => typeof value === "string" ? value.trim() : "";
        const province = text(address.province);
        return { state: province, city: text(address.city) || (province.endsWith("市") ? province : ""),
          sublocation: text(address.district), country: text(address.country),
          countryCode: text(address.countryCode) || (text(address.country) === "中国" ? "CN" : "") };
      }
      const mapStyles = new Set(["normal", "dark", "light", "whitesmoke", "fresh", "grey",
        "graffiti", "macaron", "blue", "darkblue", "wine"]);
      function mapStyleURL(style) {
        return "amap://styles/" + (mapStyles.has(style) ? style : "normal");
      }
      function setMapStyle(style) {
        if (map) map.setMapStyle(mapStyleURL(style));
      }
      let satelliteLayer;
      function setSatellite(enabled) {
        if (!map) return;
        if (enabled && !satelliteLayer) {
          satelliteLayer = new AMap.TileLayer.Satellite();
          map.add(satelliteLayer);
        }
        if (satelliteLayer) enabled ? satelliteLayer.show() : satelliteLayer.hide();
      }
      return { start, updateSnapshot, convertGPS, search, cities, focusCity, preview, selectSearch, clearPreview, setDeviceLocation,
        setMapStyle, setSatellite, navigate, zoomByWheel, region, renderingInfo, convertTracks, cancelTrack, renderTracks, fitTracks,
        setTrackStyle, pickPhotoAt, focusPhoto, focusWGS84, cancelStartup };
    })();
  </script>
</body>
</html>
