<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoTag CN 地图</title>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { background: #f0f0ed; font-family: -apple-system, sans-serif; }
    #notice { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: #fff; color: #333; padding: 10px 14px; border-radius: 6px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="notice">正在加载高德地图…</div>
  <script>
    "use strict";
    window.geoTag = (() => {
      let map, geocoder, placeSearch, marker, previewMarker;
      let previewGeneration = 0;
      let snapshot = { revision: 0, editable: false, point: null };
      let sequence = 0;
      let displayGeneration = 0;
      const notice = document.getElementById("notice");
      const post = body => window.webkit.messageHandlers.geoTag.postMessage(body);
      const status = message => { notice.textContent = message; post({ type: "status", message }); };
      const valid = point => point && Number.isFinite(point.latitude) && Number.isFinite(point.longitude)
        && Math.abs(point.latitude) <= 90 && Math.abs(point.longitude) <= 180;

      function timedCall(register) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("服务响应超时")), 15000);
          register((error, value) => {
            clearTimeout(timer);
            if (error) reject(error); else resolve(value);
          });
        });
      }

      async function convertGPS(point) {
        if (!valid(point)) throw new Error("坐标无效");
        return timedCall(done => AMap.convertFrom([point.longitude, point.latitude], "gps", (state, result) => {
          const location = result && result.locations && result.locations[0];
          if (state !== "complete" || !location) return done(new Error("坐标转换失败"));
          const converted = { latitude: location.getLat(), longitude: location.getLng() };
          done(valid(converted) ? null : new Error("返回坐标无效"), converted);
        }));
      }

      async function selectPoint(event, purpose = "apply", name = "") {
        if (purpose !== "favorite" && !snapshot.editable) { status("请先选择可编辑的照片。"); return; }
        const revision = snapshot.revision;
        const currentSequence = ++sequence;
        post({ type: "pickStarted", revision, sequence: currentSequence, purpose });
        status("正在校验所选位置…");
        try {
          const point = { latitude: event.lnglat.getLat(), longitude: event.lnglat.getLng() };
          if (!valid(point)) throw new Error("坐标无效");
          const address = await timedCall(done => geocoder.getAddress([point.longitude, point.latitude],
            (state, result) => {
              const component = result && result.regeocode && result.regeocode.addressComponent;
              done(state === "complete" && component ? null : new Error("无法确认行政区"), component);
            }));
          if (revision !== snapshot.revision || currentSequence !== sequence) return;
          post({ type: "pick", revision, sequence: currentSequence,
            latitude: point.latitude, longitude: point.longitude, purpose, name, adcode: String(address.adcode || "") });
        } catch (_) {
          if (revision === snapshot.revision && currentSequence === sequence)
            status("所选位置校验失败，未修改照片。请检查网络、凭据或服务配额。");
        }
      }

      async function updateSnapshot(next) {
        const unchanged = snapshot.point?.latitude === next.point?.latitude
          && snapshot.point?.longitude === next.point?.longitude;
        snapshot = next;
        if (unchanged) return;
        const generation = ++displayGeneration;
        ++previewGeneration;
        if (previewMarker && map) { map.remove(previewMarker); previewMarker = null; }
        if (!map) return;
        if (marker) { map.remove(marker); marker = null; }
        if (!next.point) { notice.hidden = true; return; }
        try {
          const point = await convertGPS(next.point);
          if (generation !== displayGeneration) return;
          marker = makeMarker(point, "photo");
          map.add(marker);
          map.setCenter([point.longitude, point.latitude]);
          notice.hidden = true;
        } catch (_) {
          if (generation === displayGeneration) {
            notice.hidden = false;
            status("照片位置显示失败；原照片数据未改变。请检查网络或服务配额。");
          }
        }
      }

      function makeMarker(point, kind) {
        const label = kind === "photo" ? "照片位置" : "地点预览";
        const opacity = kind === "photo" ? 1 : 0.65;
        // SVG has no bottom padding: its (16,42) tip is the bottom-center anchor.
        const content = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42"
          viewBox="0 0 32 42" style="display:block;opacity:${opacity}" role="img" aria-label="${label}">
          <defs><linearGradient id="pinRed" x2="1" y2="1">
            <stop stop-color="red"/><stop offset="1" stop-color="#e8302e"/></linearGradient></defs>
          <path d="M16 42C12 34 0 26 0 16C0 5 5 0 16 0C27 0 32 5 32 16C32 26 20 34 16 42Z"
            fill="url(#pinRed)"/>
          <path d="M6 23L13 12L18 19L22 15L27 23Z" fill="white"/>
          <circle cx="22.5" cy="9.5" r="2.5" fill="white"/>
          <path d="M3 15C4 2 17 0 25 5" fill="none" stroke="white" stroke-opacity=".45"
            stroke-width="1.3" stroke-linecap="round"/></svg>`;
        return new AMap.Marker({ position: [point.longitude, point.latitude],
          anchor: "bottom-center", content, title: label, bubble: false });
      }

      function clearPreview() {
        ++previewGeneration;
        if (previewMarker && map) map.remove(previewMarker);
        previewMarker = null;
      }

      async function preview(point, wgs84) {
        const generation = ++previewGeneration;
        try {
          if (!valid(point)) throw new Error("坐标无效");
          const displayed = wgs84 ? await convertGPS(point) : point;
          if (generation !== previewGeneration) return;
          if (previewMarker) map.remove(previewMarker);
          previewMarker = makeMarker(displayed, "preview");
          map.add(previewMarker);
          map.setZoomAndCenter(16, [displayed.longitude, displayed.latitude]);
          status("浅红色标记为预览地点，尚未修改照片。");
        } catch (_) { if (generation === previewGeneration) status("地点预览失败，请检查网络。"); }
      }

      async function search(query) {
        if (!query.trim()) return [];
        const results = await timedCall(done => placeSearch.search(query, (state, result) => {
          if (state === "no_data") return done(null, []);
          if (state !== "complete") return done(new Error("搜索失败"));
          done(null, result?.poiList?.pois || []);
        }));
        return results.filter(poi => poi.location && valid({
          latitude: poi.location.getLat(), longitude: poi.location.getLng()
        })).map((poi, index) => ({ id: String(poi.id || index), name: String(poi.name || "未命名地点"),
          address: [poi.pname, poi.cityname, poi.adname, poi.address]
            .filter(value => typeof value === "string" && value).join(" "),
          latitude: poi.location.getLat(), longitude: poi.location.getLng() }));
      }

      async function selectSearch(point, purpose, name) {
        if (!valid(point) || !["apply", "favorite"].includes(purpose)) return;
        await selectPoint({ lnglat: { getLat: () => point.latitude, getLng: () => point.longitude } }, purpose, name);
      }

      async function start(config) {
        window.forceWebGL = config.preferWebGL !== false;
        window._AMapSecurityConfig = { securityJsCode: config.securityJsCode };
        await timedCall(done => {
          const script = document.createElement("script");
          script.src = "https://webapi.amap.com/loader.js";
          script.onload = () => done(null);
          script.onerror = () => done(new Error("地图加载器不可用"));
          document.head.appendChild(script);
        });
        const api = await timedCall(done => AMapLoader.load({
          key: config.key, version: "2.0", plugins: ["AMap.Geocoder", "AMap.PlaceSearch", "AMap.Scale"]
        }).then(value => done(null, value), () => done(new Error("地图鉴权失败"))));
        map = new api.Map("map", { zoom: 12, center: [121.48, 31.23], viewMode: "2D", resizeEnable: true });
        geocoder = new api.Geocoder({ extensions: "base" });
        placeSearch = new api.PlaceSearch({ pageSize: 6, extensions: "base" });
        map.addControl(new api.Scale());
        map.on("complete", () => post({ type: "rendering", metrics: renderingInfo() }));
        setTimeout(() => post({ type: "rendering", metrics: renderingInfo() }), 5000);
        map.on("rotatechange", () => post({ type: "heading", value: map.getRotation() }));
        map.on("click", event => selectPoint(event));
        notice.hidden = true;
        status("高德地图已就绪。点选地图或搜索地点。");
        return true;
      }

      function renderingInfo() {
        const frames = [];
        function inspect(doc) {
          const canvases = Array.from(doc.querySelectorAll('canvas')).map(canvas => {
            let gl = null;
            try { gl = canvas.getContext('webgl2') || canvas.getContext('webgl')
              || canvas.getContext('experimental-webgl'); } catch (_) {}
            const rect = canvas.getBoundingClientRect();
            return { webgl: !!gl, lost: gl ? gl.isContextLost() : false,
              width: canvas.width, height: canvas.height, cssWidth: rect.width, cssHeight: rect.height };
          });
          const tiles = Array.from(doc.querySelectorAll('.amap-layer img')).filter(image => image.width > 100);
          frames.push({ canvases, rasterTiles: tiles.length });
          for (const frame of doc.querySelectorAll('iframe')) {
            try { if (frame.contentDocument) inspect(frame.contentDocument); } catch (_) {}
          }
        }
        inspect(document);
        return { preferWebGL: window.forceWebGL, sdkWebGL: !!AMap.Browser?.isWebGL,
          dpr: window.devicePixelRatio, frames };
      }

      function navigate(command) {
        if (!map) return;
        if (command === "zoomIn") map.setZoom(Math.min(20, map.getZoom() + 1));
        if (command === "zoomOut") map.setZoom(Math.max(2, map.getZoom() - 1));
        if (command === "north") map.setRotation(0);
      }
      async function region(point) {
        const displayed = await convertGPS(point);
        const result = await timedCall(done => geocoder.getAddress([displayed.longitude, displayed.latitude],
          (state, value) => state === "complete" ? done(null, value) : done(new Error("地区查询失败"))));
        const address = result?.regeocode?.addressComponent || {};
        return [...new Set([address.province, address.city, address.district]
          .filter(value => typeof value === "string" && value.length))].join(" · ");
      }
      let satelliteLayer;
      function setSatellite(enabled) {
        if (!map) return;
        if (enabled && !satelliteLayer) {
          satelliteLayer = new AMap.TileLayer.Satellite();
          map.add(satelliteLayer);
        }
        if (satelliteLayer) enabled ? satelliteLayer.show() : satelliteLayer.hide();
      }
      return { start, updateSnapshot, convertGPS, search, preview, selectSearch, clearPreview, setSatellite, navigate, region, renderingInfo };
    })();
  </script>
</body>
</html>
